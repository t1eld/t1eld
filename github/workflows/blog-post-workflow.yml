name: Latest blog post workflow
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://t1eld.pages.dev/feed.xml"
          max_post_count: 1
          template: '[![Latest Post](https://img.shields.io/badge/LATEST_POST-$title-1a1b26?style=for-the-badge&labelColor=7aa2f7&color=1a1b26&logo=rss&logoColor=1a1b26)]($url)'
